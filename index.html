<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>E-Commerce Website</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
    }

    header{
      background:#0f172a;
      color:white;
      padding:15px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
      font-size:18px;
    }

    .hero{
      height:300px;
      background:linear-gradient(to right,#1e3a8a,#2563eb);
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      text-align:center;
    }

    .hero h1{
      font-size:50px;
      margin-bottom:10px;
    }

    .hero p{
      font-size:20px;
    }

    .products{
      padding:40px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .card-content{
      padding:20px;
    }

    .card h3{
      margin-bottom:10px;
    }

    .price{
      color:green;
      font-size:22px;
      margin-bottom:15px;
    }

    button{
      background:#2563eb;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:5px;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#1d4ed8;
    }

    footer{
      background:#0f172a;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:30px;
    }

    #cart{
      font-weight:bold;
      color:#38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">AnwarShop</div>

    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Contact</a>
      <a href="#">Cart: <span id="cart">0</span></a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to AnwarShop</h1>
    <p>Best Products at Amazing Prices</p>
  </section>

  <section class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" alt="">
      <div class="card-content">
        <h3>Nike Shoes</h3>
        <div class="price">₹2999</div>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30" alt="">
      <div class="card-content">
        <h3>Smart Watch</h3>
        <div class="price">₹1999</div>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9" alt="">
      <div class="card-content">
        <h3>iPhone</h3>
        <div class="price">₹69999</div>
        <button onclick="addToCart()">Add to Cart</button>
      </div>
    </div>

  </section>

  <footer>
    <p>© 2026 AnwarShop | All Rights Reserved</p>
  </footer>

  <script>
    let count = 0;

    function addToCart(){
      count++;
      document.getElementById("cart").innerText = count;
      alert("Product Added to Cart");
    }
  </script>

</body>
</html>
