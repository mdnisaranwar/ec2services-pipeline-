<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Clone</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f1f1f1;
    }

    /* HEADER */

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 30px;
      background:white;
      position:sticky;
      top:0;
      z-index:100;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:red;
    }

    .search-box{
      display:flex;
      width:50%;
    }

    .search-box input{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:5px 0 0 5px;
      outline:none;
    }

    .search-box button{
      padding:10px 20px;
      border:none;
      background:red;
      color:white;
      cursor:pointer;
      border-radius:0 5px 5px 0;
    }

    /* MAIN LAYOUT */

    .container{
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:220px;
      background:white;
      height:100vh;
      padding:20px;
      position:sticky;
      top:70px;
    }

    .sidebar ul{
      list-style:none;
    }

    .sidebar ul li{
      padding:12px;
      margin-bottom:10px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .sidebar ul li:hover{
      background:#e5e5e5;
    }

    /* CONTENT */

    .content{
      flex:1;
      padding:20px;
    }

    /* VIDEO PLAYER */

    .video-player{
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:25px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    /* VIDEO GRID */

    .video-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
      gap:20px;
    }

    .video-card{
      background:white;
      border-radius:10px;
      overflow:hidden;
      transition:0.3s;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .video-card:hover{
      transform:scale(1.03);
    }

    .video-card img{
      width:100%;
      height:180px;
      object-fit:cover;
    }

    .video-info{
      padding:15px;
    }

    .video-info h3{
      margin-bottom:10px;
      font-size:18px;
    }

    .video-info p{
      color:gray;
      font-size:14px;
    }

    /* RESPONSIVE */

    @media(max-width:768px){

      .sidebar{
        display:none;
      }

      .search-box{
        width:70%;
      }

      header{
        padding:15px;
      }

    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">
      YouTube
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search videos...">
      <button onclick="searchVideo()">Search</button>
    </div>

  </header>

  <!-- CONTAINER -->

  <div class="container">

    <!-- SIDEBAR -->

    <div class="sidebar">
      <ul>
        <li>🏠 Home</li>
        <li>🔥 Trending</li>
        <li>🎵 Music</li>
        <li>🎮 Gaming</li>
        <li>📺 Subscriptions</li>
        <li>📚 Library</li>
      </ul>
    </div>

    <!-- CONTENT -->

    <div class="content">

      <!-- VIDEO PLAYER -->

      <div class="video-player">
        <iframe 
          width="100%" 
          height="400"
          src="https://www.youtube.com/embed/tgbNymZ7vqY"
          title="YouTube video player"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>

      <!-- VIDEO GRID -->

      <div class="video-grid">

        <div class="video-card">
          <img src="https://i.ytimg.com/vi/tgbNymZ7vqY/hqdefault.jpg">

          <div class="video-info">
            <h3>Nature Video</h3>
            <p>1M views • 2 days ago</p>
          </div>
        </div>

        <div class="video-card">
          <img src="https://i.ytimg.com/vi/kJQP7kiw5Fk/hqdefault.jpg">

          <div class="video-info">
            <h3>Music Video</h3>
            <p>500K views • 1 week ago</p>
          </div>
        </div>

        <div class="video-card">
          <img src="https://i.ytimg.com/vi/3JZ_D3ELwOQ/hqdefault.jpg">

          <div class="video-info">
            <h3>Top Songs</h3>
            <p>900K views • 5 days ago</p>
          </div>
        </div>

        <div class="video-card">
          <img src="https://i.ytimg.com/vi/fRh_vgS2dFE/hqdefault.jpg">

          <div class="video-info">
            <h3>Entertainment Video</h3>
            <p>2M views • 1 month ago</p>
          </div>
        </div>

      </div>

    </div>

  </div>

  <!-- JAVASCRIPT -->

  <script>

    function searchVideo(){

      let input = document.getElementById("searchInput").value;

      if(input === ""){
        alert("Please enter video name");
      }
      else{
        alert("Searching for: " + input);
      }

    }

  </script>

</body>
</html>
